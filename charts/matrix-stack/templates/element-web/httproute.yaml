{{- with .Values.elementWeb -}}
{{- if and .enabled .gateway.enabled .gateway.host -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
{{- include "element-io.ess-library.gateway.annotations" (dict "root" $ "context" (dict "gateway" .gateway)) | nindent 2 }}
  labels:
    {{- include "element-io.element-web.labels" (dict "root" $ "context" .) | nindent 4 }}
  name: {{ $.Release.Name }}-element-web
  namespace: {{ $.Release.Namespace }}
spec:
  hostnames:
  - {{ (tpl .gateway.host $) | quote }}
{{- include "element-io.ess-library.gateway.parentRefs" (dict "root" $ "context" .gateway.parentRefs) | nindent 2 }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $.Release.Name }}-element-web
      port: {{ include "element-io.element-web.ports" (dict "portName" "web") }}
{{- end }}
{{- end }}
