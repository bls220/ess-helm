{{- with $.Values.synapse -}}
{{- if and .enabled .gateway.enabled .gateway.host -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
{{- include "element-io.ess-library.gateway.annotations" (dict "root" $ "context" (dict "gateway" .gateway)) | nindent 2 }}
  labels:
    {{- include "element-io.synapse-ingress.labels" (dict "root" $ "context" $.Values.haproxy) | nindent 4 }}
  name: {{ $.Release.Name }}-synapse
  namespace: {{ $.Release.Namespace }}
spec:
  hostnames:
  - {{ (tpl .gateway.host $) | quote }}
{{- include "element-io.ess-library.gateway.parentRefs" (dict "root" $ "context" .gateway.parentRefs) | nindent 2 }}
  rules:
{{- range (include "element-io.synapse.ingress.additionalPaths" (dict "root" $ "context" .)) | fromYamlArray -}}
{{- if eq .availability "only_externally" }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ .path }}
    backendRefs:
    - name: {{ (tpl .service.name $) | quote }}
      {{- if .service.port.name }}
      {{- $serviceName := "" -}}
      {{- if contains "matrix-authentication-service" .service.name }}
      {{- $serviceName = "matrix-authentication-service" -}}
      {{- else if contains "hookshot" .service.name }}
      {{- $serviceName = "hookshot" -}}
      {{- end }}
      port: {{ include (printf "element-io.%s.ports" $serviceName) (dict "portName" .service.port.name) }}
      {{- else if .service.port.number }}
      port: {{ .service.port.number }}
      {{- end }}
{{- else if eq .availability "blocked" }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ .path }}
    backendRefs:
    - name: "{{ $.Release.Name }}-synapse"
      port: {{ include "element-io.synapse.ports" (dict "portName" "haproxy-403") }}
{{- end }}
{{- end }}
{{- range $synapsePath := (list "/_matrix" "/_synapse") -}}
{{- $_pathAlreadyDefined := false }}
{{- range (include "element-io.synapse.ingress.additionalPaths" (dict "root" $ "context" .)) | fromYamlArray -}}
{{- if has .availability (list "only_externally" "blocked") }}
{{- if hasPrefix .path $synapsePath }}
{{- $_pathAlreadyDefined = true }}
{{- end }}
{{- end }}
{{- end -}}
{{- if not $_pathAlreadyDefined }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ $synapsePath }}
    backendRefs:
    - name: "{{ $.Release.Name }}-synapse"
      port: {{ include "element-io.synapse.ports" (dict "portName" "haproxy-synapse") }}
{{- end }}
{{- end }}
{{- end -}}
{{- end -}}
