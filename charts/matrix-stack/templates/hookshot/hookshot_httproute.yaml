{{- with $.Values.hookshot -}}
{{- if and .enabled .gateway.enabled .gateway.host }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
{{- include "element-io.ess-library.gateway.annotations" (dict "root" $ "context" (dict "gateway" .gateway)) | nindent 2 }}
  labels:
    {{- include "element-io.hookshot.labels" (dict "root" $ "context" $.Values.haproxy) | nindent 4 }}
  name: {{ $.Release.Name }}-hookshot
  namespace: {{ $.Release.Namespace }}
spec:
  hostnames:
  - {{ (tpl .gateway.host $) | quote }}
{{- include "element-io.ess-library.gateway.parentRefs" (dict "root" $ "context" .gateway.parentRefs) | nindent 2 }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /widgetapi/v1
    backendRefs:
    - name: "{{ $.Release.Name }}-hookshot"
      port: {{ include "element-io.hookshot.ports" (dict "portName" "widgets") }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: "{{ $.Release.Name }}-hookshot"
      port: {{ include "element-io.hookshot.ports" (dict "portName" "webhooks") }}
{{- end -}}
{{- end -}}
