{{- with $.Values.wellKnownDelegation -}}
{{- if and .enabled .gateway.enabled $.Values.serverName -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
{{- include "element-io.ess-library.gateway.annotations" (dict "root" $ "context" (dict "gateway" .gateway)) | nindent 2 }}
  labels:
    {{- include "element-io.well-known-delegation-ingress.labels" (dict "root" $ "context" $.Values.haproxy) | nindent 4 }}
  name: {{ $.Release.Name }}-well-known
  namespace: {{ $.Release.Namespace }}
spec:
  hostnames:
  - "{{ tpl $.Values.serverName $ }}"
{{- include "element-io.ess-library.gateway.parentRefs" (dict "root" $ "context" .gateway.parentRefs) | nindent 2 }}
  rules:
{{- if and .baseDomainRedirect.enabled (or $.Values.elementWeb.enabled .baseDomainRedirect.url) }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: "{{ $.Release.Name }}-well-known"
      port: {{ include "element-io.well-known.ports" (dict "portName" "haproxy-wkd") }}
{{- else }}
  - matches:
    - path:
        type: PathPrefix
        value: /.well-known/matrix
    backendRefs:
    - name: "{{ $.Release.Name }}-well-known"
      port: {{ include "element-io.well-known.ports" (dict "portName" "haproxy-wkd") }}
{{- end -}}
{{- end -}}
{{- end -}}
